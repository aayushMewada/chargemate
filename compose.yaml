name: chargemate

services:
  postgres:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: chargemate
      POSTGRES_USER: chargemate
      POSTGRES_PASSWORD: chargemate
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chargemate -d chargemate"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:8.8.1-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  migrate:
    build: .
    command: ["python", "-m", "flask", "--app", "chargemate:create_app", "db", "upgrade"]
    env_file:
      - .env
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://chargemate:chargemate@postgres:5432/chargemate?connect_timeout=5
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    env_file:
      - .env
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://chargemate:chargemate@postgres:5432/chargemate?connect_timeout=5
      REDIS_URL: redis://redis:6379/0
    ports:
      - "127.0.0.1:5000:5000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health/ready', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  worker:
    build: .
    command: ["rq", "worker", "maintenance", "--url", "redis://redis:6379/0"]
    env_file:
      - .env
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://chargemate:chargemate@postgres:5432/chargemate?connect_timeout=5
      REDIS_URL: redis://redis:6379/0
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
