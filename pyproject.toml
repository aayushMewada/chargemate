[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "chargemate"
version = "0.1.0"
description = "A secure EV charging station discovery, booking, and payment platform."
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "Flask>=3.1.3,<4.0",
    "Flask-Migrate>=4.1.0,<5.0",
    "Flask-SQLAlchemy>=3.1.1,<4.0",
    "pydantic[email]>=2.12,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "python-dotenv>=1.2.2,<2.0",
    "redis>=8.1,<9.0",
    "SQLAlchemy>=2.0,<3.0",
    "Werkzeug>=3.1,<4.0",
]

[project.urls]
Repository = "https://github.com/aayushMewada/chargemate"

[tool.setuptools.packages.find]
where = ["src"]
